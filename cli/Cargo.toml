[package]
name = "tome"
version = "0.1.0"
edition = "2024"
description = "Builds interactive novels from Markdown and TOML (placeholder name)"
license = "Apache-2.0"

[[bin]]
name = "tome"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
flate2 = "1.1.10"
include_dir = "0.7.4"
notify = "8.2.0"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tiny_http = "0.12.0"
toml = "1.1.6"
ureq = "3.4.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
