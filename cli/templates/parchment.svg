<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <!-- A tiling parchment texture, drawn over the paper color: mottling, fibres and the faint
       lines of laid paper. stitchTiles keeps the noise seamless from tile to tile. -->
  <defs>
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="4" seed="8" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.16  1.2 0 0 0 -0.45"/>
    </filter>
    <filter id="fibres" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.015 0.6" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.14  0 0 0 -2.2 1.1"/>
    </filter>
    <pattern id="laid" width="400" height="8" patternUnits="userSpaceOnUse">
      <rect y="0" width="400" height="1" fill="#6b4e2e" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="400" height="400" filter="url(#mottle)" opacity="0.75"/>
  <rect width="400" height="400" filter="url(#fibres)" opacity="0.12"/>
  <rect width="400" height="400" fill="url(#laid)"/>
  <!-- Chain lines, a little darker, every 100px. -->
  <g fill="#6b4e2e" opacity="0.08">
    <rect x="49" width="2" height="400"/><rect x="149" width="2" height="400"/>
    <rect x="249" width="2" height="400"/><rect x="349" width="2" height="400"/>
  </g>
</svg>
