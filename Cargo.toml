[workspace]
members = ["cli"]
resolver = "3"

[workspace.lints.clippy]
# Promoted from pedantic/nursery: they keep code compact and units small.
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
# Keep debug noise out of test output. User-facing output opts out per function.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# These make code longer; leave them off.
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
